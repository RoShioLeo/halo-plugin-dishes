name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev/*
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JAR_DIR: build/libs
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable Corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@10.12.4 --activate
          pnpm --version

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew --no-daemon clean build

      - name: Verify JAR output
        shell: bash
        run: |
          shopt -s nullglob
          jars=($JAR_DIR/*.jar)
          if [ ${#jars[@]} -eq 0 ]; then
            echo "No jar files found in $JAR_DIR"
            exit 1
          fi
          echo "Found ${#jars[@]} jar file(s):"
          ls -lh "$JAR_DIR"

      - name: Upload plugin build
        uses: actions/upload-artifact@v4
        with:
          name: lemonslice-dishes
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
