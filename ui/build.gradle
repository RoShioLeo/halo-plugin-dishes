plugins {
    id 'base'
    id "com.github.node-gradle.node" version "7.1.0"
}

group 'com.dishes.ui'

node {
    pnpmVersion = '10.12.4'
}

tasks.register('pnpmBuild', PnpmTask) {
    group = 'build'
    description = 'Build the UI project using pnpm'
    args = ['build']
    dependsOn tasks.named('pnpmInstall')
    inputs.dir(layout.projectDirectory.dir('src'))
    inputs.files(fileTree(
        dir: layout.projectDirectory,
        includes: ['*.cjs', '*.ts', '*.js', '*.json', '*.yaml']))
    // The official bundler derives its IIFE export name from the plugin ID.
    inputs.file(rootProject.layout.projectDirectory.file('src/main/resources/plugin.yaml'))
    outputs.dir(layout.buildDirectory.dir('dist'))
}

tasks.register('pnpmCheck', PnpmTask) {
    group = 'verification'
    description = 'Run unit tests for the UI project using pnpm'
    args = ['test:unit', '--run']
    dependsOn tasks.named('pnpmInstall')
}

tasks.register('pnpmPublicCheck', PnpmTask) {
    group = 'verification'
    description = 'Verify public custom-dish rendering against kitchen changes'
    args = ['exec', 'vitest', 'run', '--root', '../web-frontend',
        '--config', '../web-frontend/vite.config.ts', 'tests/kitchenRendering.spec.ts']
    dependsOn tasks.named('pnpmInstall')
}

tasks.named('check') {
    dependsOn tasks.named('pnpmCheck')
    dependsOn tasks.named('pnpmPublicCheck')
}

tasks.named('assemble') {
    dependsOn tasks.named('pnpmBuild')
}
