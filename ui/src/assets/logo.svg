<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="lemon-title">
  <title id="lemon-title">LemonSlice 柠檬切片</title>
  <!-- A single rounded triangular wedge is rotated in exact 45-degree steps.
       A white underlay fills the center and gaps; outside the ring stays transparent. -->
  <defs>
    <path id="lemon-wedge" d="M 131.1454 113.130481 L 132.086404 29.285894 A 4 4 0 0 1 136.412866 25.344149 A 103 103 0 0 1 194.639854 49.462557 A 4 4 0 0 1 194.911889 55.309062 L 136.290204 115.261528 A 3 3 0 0 1 131.1454 113.130481 Z"/>
  </defs>
  <g transform="rotate(-7.5 128 128)">
    <circle cx="128" cy="128" r="117" fill="#ffffff"/>
    <circle cx="128" cy="128" r="117" fill="none" stroke="#ccd49d" stroke-width="2"/>
    <circle cx="128" cy="128" r="114" fill="none" stroke="#f6d94f" stroke-width="5"/>
    <use href="#lemon-wedge" fill="#f7df52" transform="rotate(0 128 128)"/>
    <use href="#lemon-wedge" fill="#f7df52" transform="rotate(45 128 128)"/>
    <use href="#lemon-wedge" fill="#f7df52" transform="rotate(90 128 128)"/>
    <use href="#lemon-wedge" fill="#ffad73" transform="rotate(135 128 128)"/>
    <use href="#lemon-wedge" fill="#f7df52" transform="rotate(180 128 128)"/>
    <use href="#lemon-wedge" fill="#f7df52" transform="rotate(225 128 128)"/>
    <use href="#lemon-wedge" fill="#f7df52" transform="rotate(270 128 128)"/>
    <use href="#lemon-wedge" fill="#f7df52" transform="rotate(315 128 128)"/>
  </g>
</svg>
