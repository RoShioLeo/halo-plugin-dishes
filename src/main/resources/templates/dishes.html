<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="/plugins/lemonslice-kitchen/assets/dishes-frontend/lemon.svg?v=@pluginVersion@"
      type="image/svg+xml"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <script src="/plugins/lemonslice-kitchen/assets/dishes-frontend/appearance-init.js?v=@pluginVersion@"></script>
    <meta th:if="${_csrf != null}" name="dishes-csrf-header" th:content="${_csrf.headerName}" />
    <meta th:if="${_csrf != null}" name="dishes-csrf-token" th:content="${_csrf.token}" />
    <link
      rel="stylesheet"
      crossorigin
      href="/plugins/lemonslice-kitchen/assets/dishes-frontend/assets/index.css?v=@pluginVersion@"
    />
    <title th:text="${title} ?: '柠檬私厨'">柠檬私厨</title>
  </head>
  <body>
    <div
      id="app"
      th:data-dishes-site-title="${title}"
      th:data-dishes-brand-title="${brandTitle}"
      th:data-dishes-brand-subtitle="${brandSubtitle}"
    ></div>
    <script th:if="${_csrf != null}">
      window.__DISHES_CSRF__ = {
        headerName: '[[${_csrf.headerName}]]',
        token: '[[${_csrf.token}]]',
      };
    </script>
    <script th:if="${publicBasePath != null}">
      window.__DISHES_PUBLIC_BASE__ = '[[${publicBasePath}]]';
    </script>
    <script th:if="${publicLogoUrl != null}">
      window.__DISHES_PUBLIC_LOGO__ = '[[${publicLogoUrl}]]';
    </script>
    <script type="module" src="/plugins/lemonslice-kitchen/assets/dishes-frontend/app.js?v=@pluginVersion@"></script>
  </body>
</html>
